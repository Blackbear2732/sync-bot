name: Sync Gitee to GitHub

on:
  # 移除了 schedule，不再定时自动运行
  workflow_dispatch: # 保留这个，可以在网页上手动点击运行
  repository_dispatch:
    types: [gitee_push]

jobs:
  # 第一个项目同步
  sync-project-1:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone from Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          # Git 网络优化配置，防止大仓库断开
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

          if [ -n "$GITEE_TOKEN" ]; then
            CLONE_URL="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          else
            CLONE_URL="https://gitee.com/${GITEE_REPO}.git"
          fi

          # 重试机制：最多尝试 3 次
          for i in {1..3}; do
            if git clone --mirror "$CLONE_URL" repo.git; then
              echo "✅ 项目1 克隆成功"
              break
            else
              echo "⚠️ 项目1 第 $i 次克隆失败，5 秒后重试..."
              rm -rf repo.git
              sleep 5
            fi
          done

          if [ ! -d "repo.git" ]; then
            echo "❌ 项目1 克隆失败，已重试 3 次，请检查网络或仓库状态"
            exit 1
          fi

      - name: Push mirror to GitHub
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          cd repo.git
          git push --mirror "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git"


  # 第二个项目同步 (sxaumedia-center-admin)
  sync-project-2:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone from Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO_2 }} 
        run: |
          # Git 网络优化配置，防止大仓库断开
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

          if [ -n "$GITEE_TOKEN" ]; then
            CLONE_URL="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          else
            CLONE_URL="https://gitee.com/${GITEE_REPO}.git"
          fi

          # 重试机制：最多尝试 3 次
          for i in {1..3}; do
            if git clone --mirror "$CLONE_URL" repo.git; then
              echo "✅ 项目2 克隆成功"
              break
            else
              echo "⚠️ 项目2 第 $i 次克隆失败，5 秒后重试..."
              rm -rf repo.git
              sleep 5
            fi
          done

          if [ ! -d "repo.git" ]; then
            echo "❌ 项目2 克隆失败，已重试 3 次，请检查网络或仓库状态"
            exit 1
          fi

      - name: Push mirror to GitHub
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO_2 }} 
        run: |
          cd repo.git
          git push --mirror "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git"
